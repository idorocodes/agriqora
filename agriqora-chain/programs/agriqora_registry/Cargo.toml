[package]
name = "agriqora_registry"
version = "0.1.0"
description = "Private-data-safe produce batch commitments for AgriQora"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agriqora_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"